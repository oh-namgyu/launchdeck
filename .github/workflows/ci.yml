name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The unit suite never invokes launchctl (the subprocess runner is
        # injectable), so these runners exercise real behaviour safely.
        include:
          # macos-latest is arm64, where setup-python has no Python 3.9 build,
          # and GitHub retired the x86_64 macos-13 runners. The suite is
          # plistlib + fakes with no real launchctl, so the 3.9 floor is
          # exercised on Linux instead.
          - os: ubuntu-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile
        run: python -m compileall -q launchdeck

      - name: Test
        run: python -m pytest tests/ -q

      - name: Smoke the entry point
        run: |
          ldm --version
          ldm --help
