[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "launchdeck"
version = "0.1.0"
description = "A zero-dependency CLI for managing personal macOS LaunchAgents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "oh-namgyu" }]
keywords = ["macos", "launchd", "launchctl", "launchagent", "cli", "daemon"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/oh-namgyu/launchdeck"
Issues = "https://github.com/oh-namgyu/launchdeck/issues"

[project.scripts]
ldm = "launchdeck.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["launchdeck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
